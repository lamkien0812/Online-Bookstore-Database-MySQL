<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<style>text{font-family:Arial,sans-serif;fill:#111} .tbl{fill:#f7f9fc;stroke:#263238;stroke-width:2} .hd{fill:#263238} .htext{fill:#fff;font-weight:bold;font-size:18px} .txt{font-size:14px} .pk{font-weight:bold} .rel{stroke:#546e7a;stroke-width:2;fill:none} .one{font-size:13px;fill:#37474f}</style>
<text x="800" y="35" text-anchor="middle" font-size="28" font-weight="bold">Online Bookstore Database ERD</text>
<path class="rel" d="M330 170 L600 170"/><text class="one" x="345" y="158">1:N</text>
<path class="rel" d="M930 170 L1240 170"/><text class="one" x="1100" y="158">1:N</text>
<path class="rel" d="M790 330 L790 520"/><text class="one" x="800" y="430">1:N</text>
<path class="rel" d="M790 700 L790 850"/><text class="one" x="800" y="775">1:N</text>
<path class="rel" d="M1120 700 L1320 850"/><text class="one" x="1195" y="765">1:1</text>
<path class="rel" d="M600 260 L450 520"/><text class="one" x="510" y="410">1:N</text>
<path class="rel" d="M980 260 L1040 520"/><text class="one" x="990" y="410">1:N</text>

<!-- categories --> <rect class="tbl" x="60" y="80" width="270" height="180"/><rect class="hd" x="60" y="80" width="270" height="40"/><text class="htext" x="195" y="106" text-anchor="middle">categories</text><text class="txt" x="75" y="145">PK category_id</text><text class="txt" x="75" y="170">UQ category_name</text><text class="txt" x="75" y="195">description</text>
<!-- books --> <rect class="tbl" x="600" y="80" width="380" height="300"/><rect class="hd" x="600" y="80" width="380" height="40"/><text class="htext" x="790" y="106" text-anchor="middle">books</text><text class="txt" x="615" y="145">PK book_id</text><text class="txt" x="615" y="170">title</text><text class="txt" x="615" y="195">UQ isbn</text><text class="txt" x="615" y="220">FK author_id</text><text class="txt" x="615" y="245">FK publisher_id</text><text class="txt" x="615" y="270">FK category_id</text><text class="txt" x="615" y="295">published_year</text><text class="txt" x="615" y="320">price, stock, status</text>
<!-- authors --> <rect class="tbl" x="1240" y="80" width="290" height="180"/><rect class="hd" x="1240" y="80" width="290" height="40"/><text class="htext" x="1385" y="106" text-anchor="middle">authors</text><text class="txt" x="1255" y="145">PK author_id</text><text class="txt" x="1255" y="170">author_name</text><text class="txt" x="1255" y="195">country</text>
<!-- publishers --> <rect class="tbl" x="220" y="470" width="290" height="180"/><rect class="hd" x="220" y="470" width="290" height="40"/><text class="htext" x="365" y="496" text-anchor="middle">publishers</text><text class="txt" x="235" y="535">PK publisher_id</text><text class="txt" x="235" y="560">UQ publisher_name</text><text class="txt" x="235" y="585">UQ phone</text>
<!-- customers --> <rect class="tbl" x="1040" y="470" width="300" height="200"/><rect class="hd" x="1040" y="470" width="300" height="40"/><text class="htext" x="1190" y="496" text-anchor="middle">customers</text><text class="txt" x="1055" y="535">PK customer_id</text><text class="txt" x="1055" y="560">full_name</text><text class="txt" x="1055" y="585">UQ email</text><text class="txt" x="1055" y="610">UQ phone</text><text class="txt" x="1055" y="635">membership_level</text>
<!-- orders --> <rect class="tbl" x="650" y="470" width="320" height="220"/><rect class="hd" x="650" y="470" width="320" height="40"/><text class="htext" x="810" y="496" text-anchor="middle">orders</text><text class="txt" x="665" y="535">PK order_id</text><text class="txt" x="665" y="560">FK customer_id</text><text class="txt" x="665" y="585">order_date</text><text class="txt" x="665" y="610">status</text><text class="txt" x="665" y="635">total_amount</text><text class="txt" x="665" y="660">shipping_fee</text>
<!-- order_items --> <rect class="tbl" x="610" y="800" width="360" height="170"/><rect class="hd" x="610" y="800" width="360" height="40"/><text class="htext" x="790" y="826" text-anchor="middle">order_items</text><text class="txt" x="625" y="865">PK order_item_id</text><text class="txt" x="625" y="890">FK order_id</text><text class="txt" x="625" y="915">FK book_id</text><text class="txt" x="625" y="940">quantity, unit_price</text>
<!-- payments --> <rect class="tbl" x="1280" y="800" width="280" height="170"/><rect class="hd" x="1280" y="800" width="280" height="40"/><text class="htext" x="1420" y="826" text-anchor="middle">payments</text><text class="txt" x="1295" y="865">PK payment_id</text><text class="txt" x="1295" y="890">UQ FK order_id</text><text class="txt" x="1295" y="915">amount, method</text><text class="txt" x="1295" y="940">date, status</text>
</svg>